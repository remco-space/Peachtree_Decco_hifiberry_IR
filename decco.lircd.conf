# LIRC configuration file for Peachtree Decco
# - march 2025 remco.space

# on raspbian (and debian & ubuntu?) this file needs to be placed in:
# /etc/lirc/lircd.conf.d

# CREDIT: this file began as the Peachtree Decco LIRC config published by
# Nick Touran (ntouran) at Part of the Thing, who did the original mode2 capture
# and irrecord work. Without it this would not exist. Thank you.
#   https://partofthething.com/thoughts/a-lirc-config-file-for-the-peachtree-audio-decco-ir-remote-control/
#
# What changed since: holding volume made the motor drive stutter. After
# soldering some bodge wires to fix my own remote, i managed to rescan the
# remote to add the "repeat" keyword. Now the volume up control doesn't stutter
# the motordrive. This makes for a much smoother volume control.
# Concretely, versus the original: a "repeat" header (9072 2239), which the
# original has none of, and a gap of 108530 rather than 251614.

#Using driver default on device /dev/lirc0
#
# This config file was automatically generated
# using lirc-0.10.1(emulation) on Mon Feb 21 14:40:40 2022
# Command line used: -a decco-mode2.conf
# Kernel version (uname -r): 5.10.92-v7+
#
# Remote name (as of config file): decco
# Brand of remote device, the thing you hold in your hand:
# Remote device model nr:
# Remote device info url:
# Does remote device has a bundled capture device e. g., a
#     usb dongle? :
# For bundled USB devices: usb vendor id, product id
#     and device string (use dmesg or lsusb):
# Type of device controlled
#     (TV, VCR, Audio, DVD, Satellite, Cable, HTPC, ...) :
# Device(s) controlled by this remote:

begin remote

  name  decco
  bits           32
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100

  header       9070  4488
  one           576  1682
  zero          576   554
  ptrail        579
  repeat       9072  2239
  gap          108530
  toggle_bit_mask 0x0
  frequency    38000

      begin codes
          MUTE                     0x40BF906F
          OPT                      0x40BF10EF
          AUX2                     0x40BFE01F
          AUX1                     0x40BFA05F
          USB                      0x40BF20DF
          COAX                     0x40BF609F
          VOL_DOWN                 0x40BF40BF
          VOL_UP                   0x40BFC03F
          OFF                      0x40BF807F
          ON                       0x40BF00FF
      end codes

end remote


